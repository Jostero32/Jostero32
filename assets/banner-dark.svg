<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif">
  <title>Kevin Carrasco · Desarrollador Full Stack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="subrayado" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <text x="64" y="104" font-size="15" font-weight="700" letter-spacing="3" fill="#60a5fa">HOLA, SOY</text>
  <text x="62" y="166" font-size="60" font-weight="800" fill="#f1f5f9">Kevin Carrasco</text>
  <rect x="64" y="184" width="120" height="5" rx="2.5" fill="url(#subrayado)"/>
  <text x="64" y="226" font-size="24" font-weight="600" fill="#f1f5f9">Desarrollador Full Stack</text>
  <text x="64" y="258" font-size="18" fill="#94a3b8">APIs, aplicaciones web y despliegue con Docker · Ambato, Ecuador</text>

  <g>
    <rect x="700" y="56" width="540" height="222" rx="12" fill="#0d1424" stroke="#24324f"/>
    <path d="M700 68 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v22 h-540 z" fill="#16203a"/>
    <circle cx="720" cy="73" r="5.5" fill="#f87171"/>
    <circle cx="738" cy="73" r="5.5" fill="#fbbf24"/>
    <circle cx="756" cy="73" r="5.5" fill="#34d399"/>
    <text x="970" y="78" text-anchor="middle" font-size="12" fill="#94a3b8">sobre-mi.ts</text>
    <g font-family="Cascadia Code, Consolas, Menlo, monospace">
    <text x="722" y="118" font-size="11" fill="#475569" text-anchor="end">1</text>
    <text x="734" y="118" font-size="14" xml:space="preserve"><tspan fill="#64748b">// abierto a prácticas y empleo</tspan></text>
    <text x="722" y="139" font-size="11" fill="#475569" text-anchor="end">2</text>
    <text x="734" y="139" font-size="14" xml:space="preserve"><tspan fill="#c084fc">const </tspan><tspan fill="#7dd3fc">kevin</tspan><tspan fill="#cbd5e1"> = {</tspan></text>
    <text x="722" y="160" font-size="11" fill="#475569" text-anchor="end">3</text>
    <text x="734" y="160" font-size="14" xml:space="preserve"><tspan fill="#7dd3fc">  rol</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#86efac">"Full Stack Developer"</tspan><tspan fill="#cbd5e1">,</tspan></text>
    <text x="722" y="181" font-size="11" fill="#475569" text-anchor="end">4</text>
    <text x="734" y="181" font-size="14" xml:space="preserve"><tspan fill="#7dd3fc">  frontend</tspan><tspan fill="#cbd5e1">: [</tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"Angular"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#cbd5e1">],</tspan></text>
    <text x="722" y="202" font-size="11" fill="#475569" text-anchor="end">5</text>
    <text x="734" y="202" font-size="14" xml:space="preserve"><tspan fill="#7dd3fc">  backend</tspan><tspan fill="#cbd5e1">: [</tspan><tspan fill="#86efac">"Spring Boot"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"Express"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"ASP.NET"</tspan><tspan fill="#cbd5e1">],</tspan></text>
    <text x="722" y="223" font-size="11" fill="#475569" text-anchor="end">6</text>
    <text x="734" y="223" font-size="14" xml:space="preserve"><tspan fill="#7dd3fc">  datos</tspan><tspan fill="#cbd5e1">: [</tspan><tspan fill="#86efac">"PostgreSQL"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"MongoDB"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"Redis"</tspan><tspan fill="#cbd5e1">],</tspan></text>
    <text x="722" y="244" font-size="11" fill="#475569" text-anchor="end">7</text>
    <text x="734" y="244" font-size="14" xml:space="preserve"><tspan fill="#7dd3fc">  despliegue</tspan><tspan fill="#cbd5e1">: [</tspan><tspan fill="#86efac">"Docker"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#86efac">"nginx"</tspan><tspan fill="#cbd5e1">],</tspan></text>
    <text x="722" y="265" font-size="11" fill="#475569" text-anchor="end">8</text>
    <text x="734" y="265" font-size="14" xml:space="preserve"><tspan fill="#cbd5e1">};</tspan></text>
    </g>
  </g>
</svg>
