<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif">
  <title>Kevin Carrasco · del pin GPIO al contenedor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d5def0"/>
    </pattern>
    <linearGradient id="traza" x1="0" x2="1">
      <stop offset="0" stop-color="#d97706"/><stop offset="0.5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#puntos)"/>

  <!-- Texto -->
  <text x="64" y="98" font-size="15" font-weight="700" letter-spacing="3" fill="#0891b2">AMBATO · ECUADOR</text>
  <text x="62" y="160" font-size="56" font-weight="800" fill="#0f172a">Kevin Carrasco</text>
  <text x="64" y="202" font-size="22" font-weight="600" fill="#475569">Desarrollador de software · IoT · Full stack</text>
  <text x="64" y="252" font-size="18" fill="#0f172a">Del <tspan font-family="Consolas, Menlo, monospace" fill="#d97706">pin GPIO</tspan> al <tspan font-family="Consolas, Menlo, monospace" fill="#7c3aed">contenedor</tspan>: firmware, protocolos, APIs y despliegue.</text>

  <!-- Ilustración: chip → protocolos → API → contenedores -->
  <g transform="translate(760,70)">
    <!-- Chip -->
    <rect x="0" y="58" width="96" height="96" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
    <rect x="22" y="80" width="52" height="52" rx="6" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.7"/>
    <text x="48" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706" font-family="Consolas, Menlo, monospace">ESP32</text>
    <g stroke="#d97706" stroke-width="2.5" stroke-linecap="round">
      <path d="M18 58 v-12 M38 58 v-12 M58 58 v-12 M78 58 v-12 M18 154 v12 M38 154 v12 M58 154 v12 M78 154 v12"/>
    </g>

    <!-- Traza -->
    <path d="M96 106 H150 C170 106 170 60 190 60 H226 M190 60 C210 60 210 106 230 106 M150 106 C170 106 170 152 190 152 H226" fill="none" stroke="url(#traza)" stroke-width="3" stroke-linecap="round"/>
    <g font-size="11" font-weight="700" font-family="Consolas, Menlo, monospace">
      <rect x="168" y="46" width="58" height="28" rx="14" fill="#ffffff" stroke="#c7d2e8"/><text x="197" y="64" text-anchor="middle" fill="#0891b2">BLE</text>
      <rect x="168" y="92" width="58" height="28" rx="14" fill="#ffffff" stroke="#c7d2e8"/><text x="197" y="110" text-anchor="middle" fill="#0891b2">MQTT</text>
      <rect x="168" y="138" width="58" height="28" rx="14" fill="#ffffff" stroke="#c7d2e8"/><text x="197" y="156" text-anchor="middle" fill="#0891b2">UDP</text>
    </g>
    <path d="M226 60 H262 C276 60 276 106 290 106 M226 152 H262 C276 152 276 106 290 106 M226 106 H290" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- API -->
    <rect x="290" y="78" width="84" height="56" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
    <text x="332" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#0891b2">API</text>
    <text x="332" y="122" text-anchor="middle" font-size="10" fill="#475569" font-family="Consolas, Menlo, monospace">REST · WS</text>
    <path d="M374 106 H408" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>

    <!-- Contenedores -->
    <g fill="#ffffff" stroke="#7c3aed" stroke-width="2.5">
      <rect x="408" y="44" width="76" height="40" rx="8"/>
      <rect x="408" y="88" width="76" height="40" rx="8"/>
      <rect x="408" y="132" width="76" height="40" rx="8"/>
    </g>
    <g fill="#7c3aed">
      <circle cx="424" cy="64" r="4"/><circle cx="424" cy="108" r="4"/><circle cx="424" cy="152" r="4"/>
    </g>
    <g font-size="11" font-family="Consolas, Menlo, monospace" fill="#475569">
      <text x="436" y="68">web</text><text x="436" y="112">api</text><text x="436" y="156">db</text>
    </g>
    <circle cx="474" cy="64" r="4" fill="#059669"/><circle cx="474" cy="108" r="4" fill="#059669"/><circle cx="474" cy="152" r="4" fill="#059669"/>
  </g>
</svg>
