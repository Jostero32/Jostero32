<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif">
  <title>Kevin Carrasco · Desarrollador Full Stack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e6edfb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.22"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="subrayado" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <text x="64" y="104" font-size="15" font-weight="700" letter-spacing="3" fill="#2563eb">HOLA, SOY</text>
  <text x="62" y="166" font-size="60" font-weight="800" fill="#0f172a">Kevin Carrasco</text>
  <rect x="64" y="184" width="120" height="5" rx="2.5" fill="url(#subrayado)"/>
  <text x="64" y="226" font-size="24" font-weight="600" fill="#0f172a">Desarrollador Full Stack</text>
  <text x="64" y="258" font-size="18" fill="#475569">APIs, aplicaciones web y despliegue con Docker · Ambato, Ecuador</text>

  <g>
    <rect x="700" y="56" width="540" height="222" rx="12" fill="#ffffff" stroke="#cfd8e8"/>
    <path d="M700 68 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v22 h-540 z" fill="#eef2f9"/>
    <circle cx="720" cy="73" r="5.5" fill="#f87171"/>
    <circle cx="738" cy="73" r="5.5" fill="#fbbf24"/>
    <circle cx="756" cy="73" r="5.5" fill="#34d399"/>
    <text x="970" y="78" text-anchor="middle" font-size="12" fill="#475569">sobre-mi.ts</text>
    <g font-family="Cascadia Code, Consolas, Menlo, monospace">
    <text x="722" y="118" font-size="11" fill="#94a3b8" text-anchor="end">1</text>
    <text x="734" y="118" font-size="14" xml:space="preserve"><tspan fill="#94a3b8">// abierto a prácticas y empleo</tspan></text>
    <text x="722" y="139" font-size="11" fill="#94a3b8" text-anchor="end">2</text>
    <text x="734" y="139" font-size="14" xml:space="preserve"><tspan fill="#9333ea">const </tspan><tspan fill="#0369a1">kevin</tspan><tspan fill="#334155"> = {</tspan></text>
    <text x="722" y="160" font-size="11" fill="#94a3b8" text-anchor="end">3</text>
    <text x="734" y="160" font-size="14" xml:space="preserve"><tspan fill="#0369a1">  rol</tspan><tspan fill="#334155">: </tspan><tspan fill="#15803d">"Full Stack Developer"</tspan><tspan fill="#334155">,</tspan></text>
    <text x="722" y="181" font-size="11" fill="#94a3b8" text-anchor="end">4</text>
    <text x="734" y="181" font-size="14" xml:space="preserve"><tspan fill="#0369a1">  frontend</tspan><tspan fill="#334155">: [</tspan><tspan fill="#15803d">"React"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"Angular"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"Next.js"</tspan><tspan fill="#334155">],</tspan></text>
    <text x="722" y="202" font-size="11" fill="#94a3b8" text-anchor="end">5</text>
    <text x="734" y="202" font-size="14" xml:space="preserve"><tspan fill="#0369a1">  backend</tspan><tspan fill="#334155">: [</tspan><tspan fill="#15803d">"Spring Boot"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"Express"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"ASP.NET"</tspan><tspan fill="#334155">],</tspan></text>
    <text x="722" y="223" font-size="11" fill="#94a3b8" text-anchor="end">6</text>
    <text x="734" y="223" font-size="14" xml:space="preserve"><tspan fill="#0369a1">  datos</tspan><tspan fill="#334155">: [</tspan><tspan fill="#15803d">"PostgreSQL"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"MongoDB"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"Redis"</tspan><tspan fill="#334155">],</tspan></text>
    <text x="722" y="244" font-size="11" fill="#94a3b8" text-anchor="end">7</text>
    <text x="734" y="244" font-size="14" xml:space="preserve"><tspan fill="#0369a1">  despliegue</tspan><tspan fill="#334155">: [</tspan><tspan fill="#15803d">"Docker"</tspan><tspan fill="#334155">, </tspan><tspan fill="#15803d">"nginx"</tspan><tspan fill="#334155">],</tspan></text>
    <text x="722" y="265" font-size="11" fill="#94a3b8" text-anchor="end">8</text>
    <text x="734" y="265" font-size="14" xml:space="preserve"><tspan fill="#334155">};</tspan></text>
    </g>
  </g>
</svg>
